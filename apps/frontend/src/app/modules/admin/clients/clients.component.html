<mat-drawer-container class="flex min-w-0 flex-auto flex-col" [hasBackdrop]="true">
    <mat-drawer
        #matDrawer
        class="w-full md:w-100"
        mode="over"
        position="end"
        [autoFocus]="false"
    >
        <app-clients-form
            [mode]="mode()"
            [clientId]="clientId()"
            (saved)="onSaved()"
            (cancelled)="onCancelled()"
        />
    </mat-drawer>

    <mat-drawer-content class="flex flex-col">
        <app-clients-list (action)="onAction($event)" />
    </mat-drawer-content>
</mat-drawer-container>
